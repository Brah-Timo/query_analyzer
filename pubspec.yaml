name: query_analyzer

description: >
  Ultra Pro Query Analyzer — A professional Dart package for automatic
  monitoring, profiling, and intelligent diagnosis of slow database queries.

version: 1.0.0

repository: https://github.com/Brah-Timo/query_analyzer

environment:
  sdk: ">=3.0.0 <4.0.0"

topics:
  - performance
  - profiling
  - monitoring
  - diagnostics
  - database

dependencies:
  meta: ^1.12.0
  collection: ^1.18.0
  equatable: ^2.0.5

  async: ^2.11.0
  rxdart: ^0.27.7

  json_annotation: ^4.9.0
  logging: ^1.3.0

  path: ^1.9.0
  intl: ^0.19.0

  uuid: ^4.3.3

  sqflite_common_ffi: ^2.3.3

  http: ^1.2.2

  crypto: ^3.0.3

dev_dependencies:
  test: ^1.25.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

  json_serializable: ^6.8.0
  lints: ^5.0.0

  coverage: ^1.8.0
